<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>NewsDash</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=0.2.12" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- Loaded non-render-blocking (media=print swapped to all on load) so a
     slow/unreachable Google Fonts CDN can never delay first paint — the
     body/heading font stacks already have solid system-font fallbacks. -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Science+Gothic:wght@400..900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
<noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Science+Gothic:wght@400..900&display=swap" rel="stylesheet" /></noscript>
<!-- Cache-bust on every release (?v=APP_VERSION) so a deploy can't leave
     browsers/CDN edges serving a stale stylesheet against fresh HTML. -->
<link rel="stylesheet" href="styles.css?v=0.2.12" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark">◆</span>
      <span class="brand-name">NewsDash</span>
      <button id="versionChip" class="version-chip" title="View patch notes">v0.2.12</button>
    </div>
    <button id="mobileMenuBtn" class="icon-btn mobile-menu-btn" aria-label="Menu" aria-expanded="false">☰</button>
    <div id="headerControls" class="header-controls">
      <div class="search-wrap">
        <input type="text" id="globalSearch" class="search-input" placeholder="Filter headlines as you type…" />
      </div>
      <div class="header-actions">
        <button id="addWidgetBtn" class="btn btn-primary">+ Add Widget</button>
        <button id="themeToggle" class="icon-btn" title="Toggle light/dark mode" aria-label="Toggle theme">🌙</button>
      </div>
    </div>
  </header>

  <div id="tickerBar" class="ticker-bar" aria-label="Breaking headlines ticker">
    <div class="ticker-scroll-area">
      <div id="tickerTrack" class="ticker-track">Loading headlines…</div>
    </div>
    <div class="ticker-speed-controls">
      <button id="tickerSlower" class="ticker-speed-btn" title="Slow down ticker">−</button>
      <button id="tickerFaster" class="ticker-speed-btn" title="Speed up ticker">+</button>
    </div>
  </div>
  <div id="tickerBar2" class="ticker-bar ticker-bar-secondary" aria-label="Markets ticker">
    <div class="ticker-scroll-area">
      <div id="tickerTrack2" class="ticker-track">Loading markets…</div>
    </div>
  </div>

  <div id="trendingTopicsBar" class="trending-topics-bar" aria-label="Trending topics across all widgets">
    <span class="trending-label">🔥 Trending</span>
    <div id="trendingTopicsChips" class="trending-chips"><span class="meta">Analyzing…</span></div>
  </div>

  <div class="app-body">
    <aside id="sidebar" class="sidebar" aria-label="Widget modules"></aside>
    <main id="widgetGrid" class="widget-grid"></main>
  </div>

  <footer class="app-footer">
    <span>NewsDash — built on free &amp; open RSS/APIs. No tracking, no keys required.</span>
  </footer>

  <button id="scrollTopBtn" class="scroll-top-btn" title="Back to top" aria-label="Scroll to top">↑</button>

  <!-- Add Widget Modal -->
  <div id="addWidgetModal" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-header">
        <h2>Add Widget</h2>
        <button class="icon-btn modal-close" data-close="addWidgetModal">✕</button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span>Widget Type</span>
          <select id="widgetTypeSelect">
            <option value="feed-bundle">News Feed Bundle</option>
            <option value="feed-custom">Custom RSS Feed</option>
            <option value="polymarket">Polymarket Forecasts</option>
            <option value="portfolio">Stock Portfolio</option>
            <option value="markets-overview">Markets Overview</option>
            <option value="wiki-trending">Trending on Wikipedia</option>
            <option value="bonds">Treasury Yields</option>
            <option value="earthquakes">Significant Earthquakes (with map)</option>
            <option value="local-alerts">Local Weather Alerts (by ZIP)</option>
            <option value="us-alerts-map">US Weather Alerts Map (nationwide)</option>
            <option value="disaster-map">Global Disasters (ReliefWeb)</option>
            <option value="service-status">Service Status (Cloudflare, GitHub, OpenAI…)</option>
            <option value="movers">Big Movers (gainers/losers)</option>
            <option value="cryptrack">CrypTrack (cryptid/UFO sightings map)</option>
          </select>
        </label>

        <div id="bundleFields" class="field-group">
          <label class="field">
            <span>Bundle</span>
            <select id="bundleSelect">
              <option value="tier1">Tier 1 Headlines (WSJ, BBC, NPR, NYT…)</option>
              <option value="breaking">Breaking News Alerts</option>
              <option value="detroit">Detroit Local</option>
              <option value="deepwire">Deep Wire (HN, Reddit, Politico…)</option>
              <option value="gaming">Gaming (WoWhead, ESO, Reddit…)</option>
              <option value="trending">Trending Now (Google Trends, Reddit)</option>
              <option value="webdev">Web & Dev (Verge, Smashing, W3C…)</option>
              <option value="security">Security & Deep Wire (Krebs, HN…)</option>
              <option value="ainews">AI News (Anthropic, OpenAI, DeepMind…)</option>
              <option value="cloudops">Cloud & Infra (AWS, Cloudflare, GitHub…)</option>
              <option value="popculture">Pop Culture (Comics, Toys, Gaming…)</option>
            </select>
          </label>
        </div>

        <div id="customFields" class="field-group hidden">
          <label class="field">
            <span>Feed Title</span>
            <input type="text" id="customName" placeholder="My Feed" />
          </label>
          <label class="field">
            <span>RSS/Atom URL</span>
            <input type="text" id="customUrl" placeholder="https://example.com/rss.xml" />
          </label>
        </div>

        <div id="polymarketFields" class="field-group hidden">
          <label class="field">
            <span>Category filter (optional)</span>
            <input type="text" id="polyCategory" placeholder="politics, crypto, sports…" />
          </label>
        </div>

        <div id="portfolioFields" class="field-group hidden">
          <label class="field">
            <span>Symbols (comma-separated)</span>
            <input type="text" id="portfolioSymbols" placeholder="AAPL, MSFT, TSLA" />
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button id="confirmAddWidget" class="btn btn-primary">Add Widget</button>
      </div>
    </div>
  </div>

  <!-- Focus Modal -->
  <div id="focusModal" class="modal-backdrop hidden">
    <div class="modal modal-large">
      <div class="modal-header">
        <h2 id="focusModalTitle">Widget</h2>
        <button class="icon-btn modal-close" data-close="focusModal">✕</button>
      </div>
      <div class="modal-body" id="focusModalBody"></div>
    </div>
  </div>

  <!-- Patch Notes Modal -->
  <div id="patchNotesModal" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-header">
        <h2>Patch Notes</h2>
        <button class="icon-btn modal-close" data-close="patchNotesModal">✕</button>
      </div>
      <div class="modal-body" id="patchNotesBody"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
  <script src="app.js?v=0.2.12" type="module"></script>
</body>
</html>
