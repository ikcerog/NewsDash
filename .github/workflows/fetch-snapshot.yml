name: Fetch Data Snapshot

# The "free DB backstop": runs server-side (no CORS/proxy involved), fetches
# every feed/quote/API NewsDash uses, and commits the result to
# public/data/snapshot.json. The static site just reads that file directly
# instead of hitting live proxied APIs on every page load — instant and
# far more reliable. Pushing this file also triggers the Pages redeploy.

on:
  schedule:
    # Cron is UTC and doesn't shift for DST; times below assume US Eastern
    # (~UTC-4 in summer, ~UTC-5 in winter), so actual local time drifts by
    # an hour across the DST boundary — an accepted, simple tradeoff rather
    # than a timezone-aware schedule.
    #
    # Weekdays: every 15 min, all day, so news/markets stay fresh during
    # the week. GitHub's scheduler doesn't guarantee on-time delivery for
    # scheduled workflows — under load, runs can slip 20-60+ min past
    # their nominal time, so requesting every 15 min is what it actually
    # takes to keep *observed* freshness near the ~30 min target (an
    # every-30-min schedule was measured landing 50-90 min apart in
    # practice). Offset a few minutes past the hour/quarter-hour (:07/:22/
    # :37/:52 instead of :00/:15/:30/:45) since jobs queued right on the
    # hour are the ones most likely to get delayed under load.
    - cron: '7,22,37,52 * * * 1-5'
    # Weekends: 3 fixed pulls (~9am/noon/6pm ET) instead of every 30 min —
    # markets are closed and news is slower, so this stays "reasonably
    # fresh" without burning runs nobody's looking at.
    - cron: '17 13,16,22 * * 0,6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Fetch snapshot
        run: node scripts/fetch-snapshot.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/snapshot.json
          if git diff --cached --quiet; then
            echo "No changes to snapshot."
          else
            git commit -m "chore: update data snapshot"
            git push
          fi
